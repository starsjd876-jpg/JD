          package com.fahad.jedi.ui;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.widget.ImageButton;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.fahad.jedi.R;
          import com.fahad.jedi.agent.GeminiAgentPlanner;
          import com.fahad.jedi.agent.ToolRegistry;
          import com.fahad.jedi.data.JediDatabaseHelper;
          import com.fahad.jedi.voice.VoiceController;

          public class MainActivity extends AppCompatActivity implements VoiceController.VoiceCallback {
              private OrbView orb;
              private TextView txtStatus;
              private VoiceController voice;
              private GeminiAgentPlanner planner;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  orb = findViewById(R.id.orbView);
                  txtStatus = findViewById(R.id.txtStatus);
                  ImageButton btnMic = findViewById(R.id.btnMic);
                  ImageButton btnChat = findViewById(R.id.btnOpenChat);
                  ImageButton btnSet = findViewById(R.id.btnSettings);

                  voice = new VoiceController(this, this);
                  planner = new GeminiAgentPlanner(this, new ToolRegistry(this), new JediDatabaseHelper(this));

                  btnMic.setOnClickListener(v -> {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                          voice.startListening();
                      } else {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, 101);
                      }
                  });

                  btnChat.setOnClickListener(v -> startActivity(new Intent(this, ChatActivity.class)));
                  btnSet.setOnClickListener(v -> startActivity(new Intent(this, SettingsActivity.class)));
              }

              public void onListeningStarted() { runOnUiThread(() -> { orb.setState(OrbView.State.LISTENING); txtStatus.setText("Listening..."); }); }
              public void onSpeechRecognized(String text) {
                  runOnUiThread(() -> { orb.setState(OrbView.State.PROCESSING); txtStatus.setText(text); });
                  planner.processUserRequest(text, new GeminiAgentPlanner.AgentCallback() {
                      public void onProgress(String s) { runOnUiThread(() -> txtStatus.setText(s)); }
                      public void onComplete(String res) {
                          runOnUiThread(() -> { orb.setState(OrbView.State.SPEAKING); txtStatus.setText(res); voice.speak(res); });
                      }
                      public void onError(String err) { runOnUiThread(() -> { orb.setState(OrbView.State.ERROR); txtStatus.setText(err); }); }
                  });
              }
              public void onSpeakingDone() { runOnUiThread(() -> { orb.setState(OrbView.State.IDLE); txtStatus.setText("JEDI Standby"); }); }
              public void onError(String msg) { runOnUiThread(() -> { orb.setState(OrbView.State.ERROR); txtStatus.setText(msg); }); }

              @Override
              protected void onDestroy() { super.onDestroy(); voice.destroy(); }
          }
