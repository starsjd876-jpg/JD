          cat << 'EOF' > app/src/main/java/com/fahad/jedi/JediApp.java
          package com.fahad.jedi;
          import android.app.Application;
          import com.fahad.jedi.data.JediDatabaseHelper;

          public class JediApp extends Application {
              @Override
              public void onCreate() {
                  super.onCreate();
                  new Thread(() -> {
                      JediDatabaseHelper db = new JediDatabaseHelper(this);
                      db.pruneChatHistory(7);
                  }).start();
