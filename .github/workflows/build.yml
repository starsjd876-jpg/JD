          cat << 'EOF' > app/src/main/java/com/fahad/jedi/agent/GeminiAgentPlanner.java
          package com.fahad.jedi.agent;

          import android.content.Context;
          import android.content.SharedPreferences;
          import com.fahad.jedi.data.JediDatabaseHelper;
          import java.util.concurrent.TimeUnit;
          import okhttp3.*;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class GeminiAgentPlanner {
              private final Context context;
              private final ToolRegistry registry;
              private final JediDatabaseHelper db;
              private final OkHttpClient client = new OkHttpClient.Builder().connectTimeout(25, TimeUnit.SECONDS).readTimeout(30, TimeUnit.SECONDS).build();

              public interface AgentCallback {
                  void onProgress(String s);
                  void onComplete(String res);
                  void onError(String err);
              }

              public GeminiAgentPlanner(Context ctx, ToolRegistry reg, JediDatabaseHelper db) {
                  this.context = ctx; this.registry = reg; this.db = db;
              }

              public void processUserRequest(String input, AgentCallback cb) {
                  SharedPreferences sp = context.getSharedPreferences("jedi_prefs", Context.MODE_PRIVATE);
                  String apiKey = sp.getString("gemini_api_key", "");

                  if (input.toLowerCase().startsWith("mera naam") && input.toLowerCase().contains("yaad")) {
                      String name = input.replaceAll("(?i).*yaad rakho (ke )?mera naam", "").trim();
                      db.setMemory("user_name", name);
                      cb.onComplete("Aapka naam " + name + " yaad rakh liya gaya hai.");
                      return;
                  } else if (input.equalsIgnoreCase("mera naam kya hai") || input.equalsIgnoreCase("mera naam kya hai?")) {
                      String name = db.getMemory("user_name");
                      cb.onComplete(name != null ? "Aapka naam " + name + " hai." : "Mujhe aapka naam nahi maloom.");
                      return;
                  }

                  if (apiKey.isEmpty()) {
                      cb.onError("Settings mein ja kar apni Gemini API Key darj karein.");
                      return;
                  }

                  new Thread(() -> {
                      try {
                          cb.onProgress("Processing...");
                          JSONObject payload = new JSONObject();
                          JSONObject contents = new JSONObject().put("role", "user");
                          contents.put("parts", new JSONArray().put(new JSONObject().put("text", input)));
                          payload.put("contents", new JSONArray().put(contents));

                          String prompt = "You are JEDI, personal AI assistant. Understand Roman Urdu and Urdu. Context: " + db.getAllMemoriesAsContext();
                          payload.put("systemInstruction", new JSONObject().put("parts", new JSONArray().put(new JSONObject().put("text", prompt))));

                          Request req = new Request.Builder()
                                  .url("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + apiKey)
                                  .post(RequestBody.create(payload.toString(), MediaType.get("application/json")))
                                  .build();

                          try (Response res = client.newCall(req).execute()) {
                              if (!res.isSuccessful() || res.body() == null) { cb.onError("HTTP " + res.code()); return; }
                              JSONObject json = new JSONObject(res.body().string());
                              String text = json.getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text");
                              db.insertMessage("user", input);
                              db.insertMessage("assistant", text);
                              cb.onComplete(text);
                          }
                      } catch (Exception e) { cb.onError(e.getMessage()); }
                  }).start();
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/fahad/jedi/voice/VoiceController.java
          package com.fahad.jedi.voice;

          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import java.util.ArrayList;
          import java.util.Locale;

          public class VoiceController {
              public interface VoiceCallback {
                  void onListeningStarted();
                  void onSpeechRecognized(String text);
                  void onSpeakingDone();
                  void onError(String msg);
              }

              private final Context context;
              private final VoiceCallback callback;
              private SpeechRecognizer speechRecognizer;
              private TextToSpeech tts;

              public VoiceController(Context ctx, VoiceCallback cb) {
                  this.context = ctx; this.callback = cb;
                  tts = new TextToSpeech(ctx, status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          if (tts.setLanguage(new Locale("ur", "PK")) == TextToSpeech.LANG_NOT_SUPPORTED) {
                              tts.setLanguage(Locale.US);
                          }
                      }
                  });
              }

              public void startListening() {
                  if (speechRecognizer == null) speechRecognizer = SpeechRecognizer.createSpeechRecognizer(context);
                  Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ur-PK");
                  speechRecognizer.setRecognitionListener(new RecognitionListener() {
                      public void onReadyForSpeech(Bundle p) { callback.onListeningStarted(); }
                      public void onResults(Bundle r) {
                          ArrayList<String> m = r.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                          if (m != null && !m.isEmpty()) callback.onSpeechRecognized(m.get(0));
                      }
                      public void onError(int e) { callback.onError("Mic error: " + e); }
                      public void onBeginningOfSpeech() {}
                      public void onRmsChanged(float r) {}
                      public void onBufferReceived(byte[] b) {}
                      public void onEndOfSpeech() {}
                      public void onPartialResults(Bundle p) {}
                      public void onEvent(int t, Bundle p) {}
                  });
                  speechRecognizer.startListening(intent);
              }

              public void stopListening() { if (speechRecognizer != null) speechRecognizer.stopListening(); }

              public void speak(String txt) {
                  if (tts != null) tts.speak(txt, TextToSpeech.QUEUE_FLUSH, null, "JEDI");
              }

              public void destroy() {
                  if (speechRecognizer != null) speechRecognizer.destroy();
                  if (tts != null) { tts.stop(); tts.shutdown(); }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/fahad/jedi/ui/OrbView.java
          package com.fahad.jedi.ui;

          import android.content.Context;
          import android.graphics.*;
          import android.util.AttributeSet;
          import android.view.View;

          public class OrbView extends View {
              public enum State { IDLE, LISTENING, PROCESSING, SPEAKING, ERROR }
              private State state = State.IDLE;
              private final Paint paintOrb = new Paint(Paint.ANTI_ALIAS_FLAG);
              private float phase = 0f;

              public OrbView(Context c) { super(c); }
              public OrbView(Context c, AttributeSet a) { super(c, a); }

              public void setState(State s) { this.state = s; postInvalidate(); }

              @Override
              protected void onDraw(Canvas canvas) {
                  super.onDraw(canvas);
                  float cx = getWidth() / 2f, cy = getHeight() / 2f;
                  float r = Math.min(cx, cy) * 0.45f;
                  phase += 0.05f;

                  int color = Color.parseColor("#00E5FF");
                  if (state == State.PROCESSING) color = Color.parseColor("#9D00FF");
                  else if (state == State.SPEAKING) color = Color.parseColor("#00FF88");
                  else if (state == State.ERROR) color = Color.parseColor("#FF3B30");

                  paintOrb.setShader(new RadialGradient(cx, cy, r + 15, new int[]{Color.WHITE, color, Color.TRANSPARENT}, new float[]{0f, 0.5f, 1f}, Shader.TileMode.CLAMP));
                  canvas.drawCircle(cx, cy, r + (float)Math.sin(phase)*8f, paintOrb);
                  postInvalidateDelayed(16);
              }
          }
          EOF

