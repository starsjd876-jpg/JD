          cat << 'EOF' > app/src/main/java/com/fahad/jedi/agent/ToolResult.java
          package com.fahad.jedi.agent;

          public class ToolResult {
              private final boolean success;
              private final String message;

              public ToolResult(boolean success, String message) {
                  this.success = success;
                  this.message = message;
              }

              public boolean isSuccess() { return success; }
              public String getMessage() { return message; }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/fahad/jedi/agent/DeviceControlTools.java
          package com.fahad.jedi.agent;

          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.hardware.camera2.CameraManager;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.provider.Settings;
          import org.json.JSONObject;

          public class DeviceControlTools {

              public static class OpenAppTool implements AgentTool {
                  private final Context context;
                  public OpenAppTool(Context context) { this.context = context; }
                  public String getName() { return "open_application"; }
                  public String getDescription() { return "Opens an application installed on the Android device."; }
                  public JSONObject getParametersSchema() {
                      try { return new JSONObject("{\"type\":\"object\",\"properties\":{\"app_name\":{\"type\":\"string\"}},\"required\":[\"app_name\"]}"); } catch (Exception e) { return new JSONObject(); }
                  }
                  public ToolResult execute(JSONObject arguments) {
                      String app = arguments.optString("app_name", "").toLowerCase();
                      PackageManager pm = context.getPackageManager();
                      if (app.contains("youtube")) {
                          Intent i = pm.getLaunchIntentForPackage("com.google.android.youtube");
                          if (i != null) { i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); context.startActivity(i); return new ToolResult(true, "YouTube open ho raha hai."); }
                      } else if (app.contains("settings")) {
                          Intent i = new Intent(Settings.ACTION_SETTINGS);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); context.startActivity(i); return new ToolResult(true, "Settings open ho chuki hain.");
                      }
                      Intent general = pm.getLaunchIntentForPackage(app);
                      if (general != null) { general.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); context.startActivity(general); return new ToolResult(true, app + " khol di gayi hai."); }
                      return new ToolResult(false, "Application '" + app + "' nahi mili.");
                  }
              }

              public static class FlashlightTool implements AgentTool {
                  private final Context context;
                  public FlashlightTool(Context context) { this.context = context; }
                  public String getName() { return "control_flashlight"; }
                  public String getDescription() { return "Turn flashlight ON or OFF."; }
                  public JSONObject getParametersSchema() {
                      try { return new JSONObject("{\"type\":\"object\",\"properties\":{\"state\":{\"type\":\"string\",\"enum\":[\"on\",\"off\"]}},\"required\":[\"state\"]}"); } catch (Exception e) { return new JSONObject(); }
                  }
                  public ToolResult execute(JSONObject arguments) {
                      try {
                          CameraManager cm = (CameraManager) context.getSystemService(Context.CAMERA_SERVICE);
                          boolean turnOn = arguments.optString("state", "off").equalsIgnoreCase("on");
                          cm.setTorchMode(cm.getCameraIdList()[0], turnOn);
                          return new ToolResult(true, "Flashlight turned " + (turnOn ? "ON." : "OFF."));
                      } catch (Exception e) {
                          return new ToolResult(false, "Flashlight error: " + e.getMessage());
                      }
                  }
              }

              public static class VolumeTool implements AgentTool {
                  private final Context context;
                  public VolumeTool(Context context) { this.context = context; }
                  public String getName() { return "control_volume"; }
                  public String getDescription() { return "Adjust media volume."; }
                  public JSONObject getParametersSchema() {
                      try { return new JSONObject("{\"type\":\"object\",\"properties\":{\"action\":{\"type\":\"string\",\"enum\":[\"mute\",\"max\",\"up\",\"down\"]}},\"required\":[\"action\"]}"); } catch (Exception e) { return new JSONObject(); }
                  }
                  public ToolResult execute(JSONObject arguments) {
                      AudioManager am = (AudioManager) context.getSystemService(Context.AUDIO_SERVICE);
                      if (am == null) return new ToolResult(false, "Audio service unavailable.");
                      int max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                      int cur = am.getStreamVolume(AudioManager.STREAM_MUSIC);
                      String act = arguments.optString("action", "up");
                      if (act.equals("max")) am.setStreamVolume(AudioManager.STREAM_MUSIC, max, AudioManager.FLAG_SHOW_UI);
                      else if (act.equals("mute")) am.setStreamVolume(AudioManager.STREAM_MUSIC, 0, AudioManager.FLAG_SHOW_UI);
                      else if (act.equals("down")) am.setStreamVolume(AudioManager.STREAM_MUSIC, Math.max(0, cur - 2), AudioManager.FLAG_SHOW_UI);
                      else am.setStreamVolume(AudioManager.STREAM_MUSIC, Math.min(max, cur + 2), AudioManager.FLAG_SHOW_UI);
                      return new ToolResult(true, "Volume adjust kar di gayi hai.");
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/fahad/jedi/research/WebSearchService.java
          package com.fahad.jedi.research;

          import com.fahad.jedi.agent.AgentTool;
          import com.fahad.jedi.agent.ToolResult;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.util.concurrent.TimeUnit;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.Response;
          import org.json.JSONObject;

          public class WebSearchService implements AgentTool {
              private final OkHttpClient client = new OkHttpClient.Builder().connectTimeout(12, TimeUnit.SECONDS).readTimeout(12, TimeUnit.SECONDS).build();

              public String getName() { return "search_web"; }
              public String getDescription() { return "Live web search for news and facts."; }
              public JSONObject getParametersSchema() {
                  try { return new JSONObject("{\"type\":\"object\",\"properties\":{\"query\":{\"type\":\"string\"}},\"required\":[\"query\"]}"); } catch (Exception e) { return new JSONObject(); }
              }
              public ToolResult execute(JSONObject arguments) {
                  try {
                      String q = URLEncoder.encode(arguments.optString("query", ""), StandardCharsets.UTF_8.toString());
                      Request req = new Request.Builder().url("https://html.duckduckgo.com/html/?q=" + q).header("User-Agent", "Mozilla/5.0").build();
                      try (Response res = client.newCall(req).execute()) {
                          if (!res.isSuccessful() || res.body() == null) return new ToolResult(false, "Search failed.");
                          Matcher m = Pattern.compile("class=\"result__snippet\"[^>]*>(.*?)</a>", Pattern.DOTALL).matcher(res.body().string());
                          StringBuilder sb = new StringBuilder();
                          int c = 0;
                          while (m.find() && c < 3) {
                              c++;
                              sb.append(c).append(". ").append(m.group(1).replaceAll("<[^>]*>", "").replaceAll("&quot;", "\"")).append("\n");
                          }
                          return new ToolResult(true, sb.length() > 0 ? sb.toString() : "No results found.");
                      }
                  } catch (Exception e) { return new ToolResult(false, "Search error: " + e.getMessage()); }
              }
          }
