          package com.fahad.jedi.ui;

          import android.os.Bundle;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.*;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.recyclerview.widget.LinearLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;
          import com.fahad.jedi.R;
          import com.fahad.jedi.agent.GeminiAgentPlanner;
          import com.fahad.jedi.agent.ToolRegistry;
          import com.fahad.jedi.data.JediDatabaseHelper;
          import java.util.ArrayList;
          import java.util.List;

          public class ChatActivity extends AppCompatActivity {
              private final List<JediDatabaseHelper.ChatMessage> list = new ArrayList<>();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_chat);

                  JediDatabaseHelper db = new JediDatabaseHelper(this);
                  GeminiAgentPlanner planner = new GeminiAgentPlanner(this, new ToolRegistry(this), db);

                  RecyclerView rv = findViewById(R.id.recyclerMessages);
                  EditText input = findViewById(R.id.editChatInput);
                  ImageButton send = findViewById(R.id.btnSend);

                  ChatAdapter adapter = new ChatAdapter(list);
                  rv.setLayoutManager(new LinearLayoutManager(this));
                  rv.setAdapter(adapter);

                  list.addAll(db.getRecentChat(50));
                  adapter.notifyDataSetChanged();

                  send.setOnClickListener(v -> {
                      String txt = input.getText().toString().trim();
                      if (!txt.isEmpty()) {
                          list.add(new JediDatabaseHelper.ChatMessage(0, "user", txt, System.currentTimeMillis()));
                          adapter.notifyItemInserted(list.size() - 1);
                          input.setText("");
                          planner.processUserRequest(txt, new GeminiAgentPlanner.AgentCallback() {
                              public void onProgress(String s) {}
                              public void onComplete(String res) {
                                  runOnUiThread(() -> {
                                      list.add(new JediDatabaseHelper.ChatMessage(0, "assistant", res, System.currentTimeMillis()));
                                      adapter.notifyItemInserted(list.size() - 1);
                                      rv.scrollToPosition(list.size() - 1);
                                  });
                              }
                              public void onError(String err) { runOnUiThread(() -> Toast.makeText(ChatActivity.this, err, Toast.LENGTH_SHORT).show()); }
                          });
                      }
                  });
              }

              static class ChatAdapter extends RecyclerView.Adapter<ChatAdapter.VH> {
                  List<JediDatabaseHelper.ChatMessage> data;
                  ChatAdapter(List<JediDatabaseHelper.ChatMessage> d) { this.data = d; }
                  @NonNull public VH onCreateViewHolder(@NonNull ViewGroup p, int t) {
                      return new VH(LayoutInflater.from(p.getContext()).inflate(R.layout.item_chat_message, p, false));
                  }
                  public void onBindViewHolder(@NonNull VH h, int pos) {
                      h.sender.setText(data.get(pos).role.toUpperCase());
                      h.body.setText(data.get(pos).content);
                  }
                  public int getItemCount() { return data.size(); }
                  static class VH extends RecyclerView.ViewHolder {
                      TextView sender, body;
                      VH(View v) { super(v); sender = v.findViewById(R.id.txtSender); body = v.findViewById(R.id.txtBody); }
                  }
              }
          }
