          cat << 'EOF' > app/src/main/java/com/fahad/jedi/data/JediDatabaseHelper.java
          package com.fahad.jedi.data;

          import android.content.ContentValues;
          import android.content.Context;
          import android.database.Cursor;
          import android.database.sqlite.SQLiteDatabase;
          import android.database.sqlite.SQLiteOpenHelper;
          import java.util.ArrayList;
          import java.util.List;

          public class JediDatabaseHelper extends SQLiteOpenHelper {
              private static final String DATABASE_NAME = "jedi_local.db";
              private static final int DATABASE_VERSION = 1;

              public JediDatabaseHelper(Context context) {
                  super(context, DATABASE_NAME, null, DATABASE_VERSION);
              }

              @Override
              public void onCreate(SQLiteDatabase db) {
                  db.execSQL("CREATE TABLE chat_history (_id INTEGER PRIMARY KEY AUTOINCREMENT, role TEXT NOT NULL, content TEXT NOT NULL, timestamp INTEGER NOT NULL);");
                  db.execSQL("CREATE TABLE personal_memory (mem_key TEXT PRIMARY KEY, mem_value TEXT NOT NULL, updated_at INTEGER NOT NULL);");
              }

              @Override
              public void onUpgrade(SQLiteDatabase db, int o, int n) {
                  db.execSQL("DROP TABLE IF EXISTS chat_history");
                  db.execSQL("DROP TABLE IF EXISTS personal_memory");
                  onCreate(db);
              }

              public synchronized void insertMessage(String role, String content) {
                  SQLiteDatabase db = getWritableDatabase();
                  ContentValues cv = new ContentValues();
                  cv.put("role", role);
                  cv.put("content", content);
                  cv.put("timestamp", System.currentTimeMillis());
                  db.insert("chat_history", null, cv);
              }

              public synchronized List<ChatMessage> getRecentChat(int limit) {
                  List<ChatMessage> list = new ArrayList<>();
                  SQLiteDatabase db = getReadableDatabase();
                  Cursor c = db.query("chat_history", null, null, null, null, null, "timestamp DESC", String.valueOf(limit));
                  if (c != null && c.moveToFirst()) {
                      do {
                          list.add(0, new ChatMessage(c.getLong(0), c.getString(1), c.getString(2), c.getLong(3)));
                      } while (c.moveToNext());
                      c.close();
                  }
                  return list;
              }

              public synchronized void pruneChatHistory(int days) {
                  long threshold = System.currentTimeMillis() - (days * 86400000L);
                  getWritableDatabase().delete("chat_history", "timestamp < ?", new String[]{String.valueOf(threshold)});
              }

              public synchronized void setMemory(String k, String v) {
                  ContentValues cv = new ContentValues();
                  cv.put("mem_key", k.trim().toLowerCase());
                  cv.put("mem_value", v.trim());
                  cv.put("updated_at", System.currentTimeMillis());
                  getWritableDatabase().insertWithOnConflict("personal_memory", null, cv, SQLiteDatabase.CONFLICT_REPLACE);
              }

              public synchronized String getMemory(String k) {
                  Cursor c = getReadableDatabase().query("personal_memory", new String[]{"mem_value"}, "mem_key = ?", new String[]{k.trim().toLowerCase()}, null, null, null);
                  String r = null;
                  if (c != null && c.moveToFirst()) {
                      r = c.getString(0);
                      c.close();
                  }
                  return r;
              }

              public synchronized String getAllMemoriesAsContext() {
                  Cursor c = getReadableDatabase().query("personal_memory", null, null, null, null, null, null);
                  StringBuilder sb = new StringBuilder();
                  if (c != null && c.moveToFirst()) {
                      do {
                          sb.append("- ").append(c.getString(0)).append(": ").append(c.getString(1)).append("\n");
                      } while (c.moveToNext());
                      c.close();
                  }
                  return sb.toString();
              }

              public static class ChatMessage {
                  public long id;
                  public String role, content;
                  public long timestamp;
                  public ChatMessage(long id, String r, String c, long t) { this.id = id; this.role = r; this.content = c; this.timestamp = t; }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/fahad/jedi/agent/AgentTool.java
          package com.fahad.jedi.agent;
          import org.json.JSONObject;

